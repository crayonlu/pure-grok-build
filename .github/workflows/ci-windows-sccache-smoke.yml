name: Temporary Windows local sccache smoke test

on:
  push:
    branches:
      - codex/windows-sccache

permissions:
  actions: write
  contents: read

env:
  BINARY_PACKAGE: xai-grok-pager-bin
  # Use a filesystem cache so sccache writes one archive through actions/cache.
  # instead of issuing one GitHub cache write per compiler object.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 5G
  SCCACHE_GHA_ENABLED: false
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Windows local sccache build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install protoc
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath $HOME\protoc
          echo "$HOME\protoc\bin" >> $env:GITHUB_PATH
          echo "PROTOC=$HOME\protoc\bin\protoc.exe" >> $env:GITHUB_ENV

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Restore local sccache archive
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-msvc-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-windows-msvc-v1-

      - name: Build release binary through local sccache
        run: cargo build -p ${{ env.BINARY_PACKAGE }} --release --locked --target x86_64-pc-windows-msvc

      - name: Show local sccache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Stop sccache before archive
        if: always()
        shell: pwsh
        run: sccache --stop-server
