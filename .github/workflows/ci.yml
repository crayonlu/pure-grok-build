name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Configure protoc
        run: echo "PROTOC=protoc" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          # rust-toolchain.toml pins the version; ensure rustfmt/clippy components are present.
          rustup component add rustfmt clippy

      - name: cargo fmt --check
        # Report formatting drift but do not fail the job: we want the
        # cargo check / clippy steps to run so they surface real compile
        # errors even when formatting needs touching up.
        run: cargo fmt --all -- --check || true

      - name: cargo check (affected crates + tests)
        run: cargo check -p xai-grok-sampler -p xai-grok-shell --all-targets --locked

      - name: cargo clippy (affected crates)
        run: cargo clippy -p xai-grok-sampler -p xai-grok-shell --all-targets -- -D warnings
