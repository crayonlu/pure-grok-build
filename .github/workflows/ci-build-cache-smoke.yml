name: Temporary Rust cache smoke test
# Warm pass: the preceding cold run seeded one archive per target.

on:
  push:
    branches:
      - codex/ci-build-cache

permissions:
  actions: write
  contents: read

env:
  BINARY_PACKAGE: xai-grok-pager-bin
  BINARY_NAME: xai-grok-pager

jobs:
  build:
    name: Smoke build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          echo "PROTOC=protoc" >> "$GITHUB_ENV"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=protoc" >> "$GITHUB_ENV"

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath $HOME\protoc
          echo "$HOME\protoc\bin" >> $env:GITHUB_PATH
          echo "PROTOC=$HOME\protoc\bin\protoc.exe" >> $env:GITHUB_ENV

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies and target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "smoke-${{ matrix.target }}"
          add-job-id-key: "false"
          cache-targets: "true"
          cache-all-crates: "true"
          cache-bin: "false"
          # The smoke workflow runs on this branch so its first pass can seed
          # the exact cache consumed by the warm validation push.
          save-if: ${{ startsWith(github.ref, 'refs/heads/codex/') }}

      - name: Build release binary
        run: cargo build -p ${{ env.BINARY_PACKAGE }} --release --locked --target ${{ matrix.target }}
